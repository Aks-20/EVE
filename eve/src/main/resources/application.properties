spring.application.name=eve
# ========================================
# Application
# ========================================



server.port=9090



# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/EVE 
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
jwt.secret=${JWT_SECRET:default-secret-key-for-eve-healthcare-application-jwt-token-generation-256bit}
jwt.expiration=3600000
webhook.secret=${WEBHOOK_SECRET:local-webhook-secret}