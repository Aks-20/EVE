spring.application.name=eve
# ========================================
# Application
# ========================================



server.port=9090



# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/EVE 
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
jwt.secret=${JWT_SECRET:default-secret-key-for-eve-healthcare-application-jwt-token-generation-256bit}
jwt.expiration=3600000

# Optional initial admin account; set all three environment variables to enable.
app.admin.name=${ADMIN_NAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}